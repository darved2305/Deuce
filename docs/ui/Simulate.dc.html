<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game simulation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#62C7D5;text-decoration:none}a:hover{color:#8FDCE6}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #101519; color: #F3F0E8; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">

  <div style="padding: 18px 20px 0 20px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: center; height: 40px">
      <a href="Rally.dc.html" aria-label="Close simulation" style="width: 40px; height: 40px; display: flex; align-items: center; color: #A9B4B8">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
      <div style="display: flex; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em">
        <span style="color: #62C7D5">READ ✓</span><span style="color: #4A585E">—</span>
        <span style="color: #F3F0E8; border-bottom: 2px solid #DCE76B; padding-bottom: 2px">DECIDE</span><span style="color: #4A585E">—</span>
        <span style="color: #7E8A8F">REVEAL</span>
      </div>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #A9B4B8; width: 40px; text-align: right">3/5</span>
    </div>
  </div>

  <div style="padding: 6px 20px 0 20px; display: flex; flex-direction: column; gap: 12px">
    <div style="position: relative; border-radius: 16px; overflow: hidden">
      <svg width="350" height="150" viewBox="0 0 350 150" role="img" aria-label="Frozen frame just before your contact: Arjun's drop is arriving at your front left corner; Arjun is still at the net on the right">
        <rect width="350" height="150" fill="#0A1719"></rect>
        <polygon points="104,14 246,14 346,148 4,148" fill="#123F39"></polygon>
        <g stroke="#E9E6DC" stroke-opacity="0.8" stroke-width="1.2" fill="none">
          <polygon points="104,14 246,14 346,148 4,148"></polygon>
          <line x1="70" y1="60" x2="280" y2="60"></line>
          <line x1="52" y1="92" x2="298" y2="92"></line>
          <line x1="175" y1="14" x2="175" y2="60"></line>
          <line x1="175" y1="92" x2="175" y2="148"></line>
        </g>
        <rect x="62" y="62" width="226" height="16" fill="#05090A" fill-opacity="0.45"></rect>
        <line x1="62" y1="62" x2="288" y2="62" stroke="#F3F0E8" stroke-width="1.5"></line>
        <circle cx="242" cy="50" r="4" fill="#F39B68"></circle>
        <rect x="238" y="54.5" width="8" height="13" rx="2" fill="#F39B68"></rect>
        <path d="M232 52 Q 170 48 116 98" stroke="#DCE76B" stroke-width="1.6" fill="none" stroke-dasharray="3 3"></path>
        <circle cx="116" cy="98" r="3" fill="#F3F0E8"></circle>
        <circle cx="100" cy="102" r="6" fill="#62C7D5"></circle>
        <rect x="94" y="109" width="12" height="22" rx="3" fill="#62C7D5"></rect>
        <rect x="0" y="0" width="350" height="150" fill="#101519" fill-opacity="0.18"></rect>
      </svg>
      <span style="position: absolute; left: 10px; top: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em; background: #DCE76B; color: #101519; font-weight: 600; padding: 4px 8px; border-radius: 6px">FROZEN · BEFORE YOUR CONTACT</span>
    </div>

    <h1 style="margin: 0; font-size: 24px; font-weight: 600; line-height: 1.15">Where do you play it?</h1>

    <svg width="350" height="250" viewBox="0 0 350 250" role="img" aria-label="Top-down court of Arjun's half with nine target zones. You picked the back left corner, outside Arjun's reach circle.">
      <rect width="350" height="250" rx="14" fill="#0F2A2A"></rect>
      <rect x="90" y="20" width="56.7" height="62" fill="#62C7D5" fill-opacity="0.32"></rect>
      <g stroke="#E9E6DC" stroke-opacity="0.18" stroke-width="1" fill="none">
        <line x1="146.7" y1="20" x2="146.7" y2="206"></line>
        <line x1="203.3" y1="20" x2="203.3" y2="206"></line>
        <line x1="90" y1="82" x2="260" y2="82"></line>
        <line x1="90" y1="144" x2="260" y2="144"></line>
      </g>
      <rect x="90" y="20" width="170" height="8" fill="#F39B68" fill-opacity="0.18"></rect>
      <rect x="90" y="20" width="8" height="186" fill="#F39B68" fill-opacity="0.18"></rect>
      <rect x="252" y="20" width="8" height="186" fill="#F39B68" fill-opacity="0.18"></rect>
      <g stroke="#E9E6DC" stroke-opacity="0.85" stroke-width="1.3" fill="none">
        <rect x="90" y="20" width="170" height="226"></rect>
        <line x1="90" y1="151" x2="260" y2="151"></line>
        <line x1="175" y1="20" x2="175" y2="151"></line>
      </g>
      <line x1="80" y1="206" x2="270" y2="206" stroke="#F3F0E8" stroke-width="2.4"></line>
      <circle cx="232" cy="176" r="60" fill="#F39B68" fill-opacity="0.06" stroke="#F39B68" stroke-width="1.2" stroke-dasharray="4 4"></circle>
      <circle cx="232" cy="176" r="6" fill="#F39B68"></circle>
      <path d="M118 236 L 118 50" stroke="#62C7D5" stroke-width="1.6" stroke-dasharray="2 4"></path>
      <circle cx="118" cy="236" r="7" fill="#62C7D5"></circle>
      <g transform="translate(118,44)">
        <circle cx="0" cy="0" r="13" fill="#62C7D5"></circle>
        <circle cx="0" cy="0" r="4" fill="#101519"></circle>
      </g>
      <text x="300" y="180" font-family="IBM Plex Mono, monospace" font-size="10" fill="#F39B68">REACH</text>
      <text x="300" y="194" font-family="IBM Plex Mono, monospace" font-size="10" fill="#F39B68">~0.6 s</text>
      <text x="30" y="56" font-family="IBM Plex Mono, monospace" font-size="10" fill="#62C7D5">YOUR</text>
      <text x="30" y="70" font-family="IBM Plex Mono, monospace" font-size="10" fill="#62C7D5">PICK</text>
      <text x="16" y="226" font-family="IBM Plex Mono, monospace" font-size="10" fill="#A9B4B8">YOU</text>
    </svg>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: grid; grid-template-columns: 88px minmax(0, 1fr) 112px; gap: 10px; align-items: center">
        <span style="font-size: 14px">Open space</span>
        <div style="height: 8px; border-radius: 4px; background: #2C3940; overflow: hidden"><div style="width: 82%; height: 8px; background: #62C7D5"></div></div>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #A9B4B8">4.1 m from him</span>
      </div>
      <div style="display: grid; grid-template-columns: 88px minmax(0, 1fr) 112px; gap: 10px; align-items: center">
        <span style="font-size: 14px">Risk</span>
        <div style="height: 8px; border-radius: 4px; background: #2C3940; overflow: hidden"><div style="width: 38%; height: 8px; background: #F39B68"></div></div>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #A9B4B8">~45 cm to lines</span>
      </div>
      <div style="display: grid; grid-template-columns: 88px minmax(0, 1fr) 112px; gap: 10px; align-items: center">
        <span style="font-size: 14px">Your history</span>
        <div style="height: 8px; border-radius: 4px; background: #2C3940; overflow: hidden"><div style="width: 75%; height: 8px; background: #DCE76B"></div></div>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #A9B4B8">won 3 of 4</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 8px; margin-top: 2px">
      <button style="height: 54px; border-radius: 14px; border: 0; background: #DCE76B; color: #101519; font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">Reveal what happened</button>
      <button style="height: 54px; border-radius: 14px; border: 1px solid #2F3D44; background: transparent; color: #F3F0E8; font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; cursor: pointer">Send to Arjun</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
