<!doctype html>
<html lang="en">
<head>

<title>Add a match</title>

<body>
<x-dc>
<helmet>

<style>
body{margin:0}
a{color:#62C7D5;text-decoration:none}a:hover{color:#8FDCE6}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #101519; color: #F3F0E8; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">

  <div style="padding: 18px 20px 0 20px; display: flex; justify-content: space-between; align-items: center; height: 62px">
    <a href="Today.dc.html" aria-label="Cancel" style="width: 44px; height: 44px; display: flex; align-items: center; color: #A9B4B8">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <span style="font-size: 16px; font-weight: 600">New match</span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #A9B4B8; width: 44px; text-align: right">52:14</span>
  </div>

  <div style="padding: 8px 20px 0 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="position: relative; border-radius: 18px; overflow: hidden">
      <svg width="350" height="206" viewBox="0 0 350 206" role="img" aria-label="First clear frame of your video with the suggested court outline and four corner handles">
        <rect width="350" height="206" fill="#0A1719"></rect>
        <rect x="0" y="0" width="350" height="40" fill="#0D1F22"></rect>
        <polygon points="102,34 248,34 334,196 16,196" fill="#123F39"></polygon>
        <g stroke="#E9E6DC" stroke-opacity="0.55" stroke-width="1.2" fill="none">
          <line x1="72" y1="88" x2="278" y2="88"></line>
          <line x1="54" y1="124" x2="296" y2="124"></line>
          <line x1="175" y1="34" x2="175" y2="88"></line>
          <line x1="175" y1="124" x2="175" y2="196"></line>
        </g>
        <line x1="64" y1="92" x2="286" y2="92" stroke="#F3F0E8" stroke-width="1.5"></line>
        <polygon points="102,34 248,34 334,196 16,196" fill="#62C7D5" fill-opacity="0.1" stroke="#62C7D5" stroke-width="2"></polygon>
        <circle cx="206" cy="66" r="4" fill="#F39B68"></circle><rect x="202" y="70.5" width="8" height="13" rx="2" fill="#F39B68"></rect>
        <circle cx="128" cy="150" r="6" fill="#F3F0E8"></circle><rect x="122" y="157" width="12" height="24" rx="3" fill="#F3F0E8"></rect>
        <g fill="#101519" stroke="#62C7D5" stroke-width="2.5">
          <circle cx="102" cy="34" r="8"></circle>
          <circle cx="248" cy="34" r="8"></circle>
          <circle cx="334" cy="196" r="8"></circle>
          <circle cx="16" cy="196" r="8"></circle>
        </g>
        <circle cx="282" cy="96" r="40" fill="#0A1719" stroke="#F3F0E8" stroke-width="2"></circle>
        <polygon points="250,70 330,70 330,140 270,140" fill="#123F39"></polygon>
        <line x1="242" y1="70" x2="322" y2="70" stroke="#E9E6DC" stroke-width="3"></line>
        <line x1="242" y1="70" x2="254" y2="136" stroke="#E9E6DC" stroke-width="3"></line>
        <circle cx="282" cy="96" r="40" fill="none" stroke="#F3F0E8" stroke-width="2"></circle>
        <line x1="282" y1="86" x2="282" y2="106" stroke="#62C7D5" stroke-width="1.5"></line>
        <line x1="272" y1="96" x2="292" y2="96" stroke="#62C7D5" stroke-width="1.5"></line>
      </svg>
      <span style="position: absolute; left: 10px; bottom: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; background: rgba(16,21,25,0.86); padding: 4px 8px; border-radius: 6px">COURT FOUND · DRAG A CORNER TO ADJUST</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; color: #A9B4B8">Sport</span>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <button style="height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #F3F0E8; color: #101519; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">Badminton</button>
        <button style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #2F3D44; background: transparent; color: #F3F0E8; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; cursor: pointer">Table tennis</button>
        <button style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #2F3D44; background: transparent; color: #F3F0E8; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; cursor: pointer">Tennis</button>
        <button style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #2F3D44; background: transparent; color: #A9B4B8; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; cursor: pointer">Free play</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; color: #A9B4B8">Which one is you?</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button style="height: 56px; border-radius: 14px; border: 1.5px solid #62C7D5; background: rgba(98,199,213,0.1); color: #F3F0E8; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; display: flex; align-items: center; gap: 10px; padding: 0 12px; cursor: pointer">
          <span style="width: 28px; height: 28px; border-radius: 14px; background: #62C7D5; flex: none"></span>Near side · me</button>
        <button style="height: 56px; border-radius: 14px; border: 1px solid #2F3D44; background: transparent; color: #F3F0E8; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; display: flex; align-items: center; gap: 10px; padding: 0 12px; cursor: pointer">
          <span style="width: 28px; height: 28px; border-radius: 14px; background: #F39B68; flex: none"></span>Far · Arjun</button>
      </div>
    </div>

    <div style="background: #1D272D; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; color: #A9B4B8">What this clip supports</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; font-size: 13px">
        <span><span style="color: #62C7D5">●</span> 1080p · 60 fps</span>
        <span><span style="color: #62C7D5">●</span> Camera still</span>
        <span><span style="color: #62C7D5">●</span> Shuttle trail, line calls</span>
        <span><span style="color: #F39B68">◐</span> Speed: estimate only</span>
      </div>
    </div>

    <a href="Analysing.dc.html" style="height: 56px; border-radius: 16px; background: #DCE76B; color: #101519; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Analyse match</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
