name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where is the problem?
      options: [android, engine, api (supabase), sdk, mcp, docs, ci]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands and output, or the clip id from fixtures/clips.md. Do not paste secrets or tokens.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit hash or release
