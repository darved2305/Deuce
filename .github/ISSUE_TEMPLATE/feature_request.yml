name: Feature request
description: Suggest an addition
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: This project does not use invented data. Say what real evidence the feature would be built on.
    validations:
      required: true
