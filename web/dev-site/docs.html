<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elevate API Reference</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --scalar-font:"Space Grotesk",system-ui,sans-serif;
  --scalar-font-code:"JetBrains Mono",ui-monospace,monospace;
  --scalar-color-accent:#0d8a63;
}
body{margin:0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;border-bottom:1px solid #e2e6e3;font:500 14px "Space Grotesk",system-ui,sans-serif}
.bar a{color:inherit;text-decoration:none}
.logo{font-weight:700;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:#0d8a63}
</style>
</head>
<body>
<div class="bar">
  <a class="logo" href="index.html"><span class="dot" aria-hidden="true"></span>elevate</a>
  <span>API reference · spec from <code>/v1/openapi.json</code></span>
</div>
<script id="api-reference" data-url="openapi.json"></script>
<script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.73.1/dist/browser/standalone.js"></script>

</html>
